[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeai-costbench"
version = "0.1.0"
description = "Reproducible ONNX edge inference performance and cost benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "faheemkhaskheli9"}]
keywords = ["edge-ai", "benchmark", "onnx", "inference", "cost"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
cpu = ["numpy>=1.24", "onnxruntime>=1.17", "psutil>=5.9"]
gpu = ["numpy>=1.24", "onnxruntime-gpu>=1.17", "psutil>=5.9"]
test = ["pytest>=7"]

[project.scripts]
edgecostbench = "edgecostbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
